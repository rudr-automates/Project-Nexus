name: ${COMPOSE_PROJECT_NAME}

services:

  postgres:
    image: postgres:17

    container_name: project-nexus-postgres

    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - nexus-network



  n8n:
    image: n8nio/n8n:2.29.10

    container_name: project-nexus-n8n

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_healthy

    env_file:
      - ../../.env

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_PROXY_HOPS: 1

    ports:
      - "${N8N_PORT}:5678"

    volumes:
      - n8n-data:/home/node/.n8n

    networks:
      - nexus-network

  browserless:

    image: ghcr.io/browserless/chromium:latest

    container_name: project-nexus-browserless

    restart: unless-stopped

    environment:
      TOKEN: ${BROWSERLESS_TOKEN}
      CONCURRENT: ${BROWSERLESS_CONCURRENT}
      TIMEOUT: ${BROWSERLESS_TIMEOUT}

    ports:
      - "3000:3000"

    shm_size: 2gb

    networks:
      - nexus-network

  scraper:

    build:
      context: ../../services/scraper

    image: project-nexus/scraper:1.0.0

    container_name: project-nexus-scraper

    restart: unless-stopped

    depends_on:
      browserless:
        condition: service_started

    env_file:
      - ../../.env

    environment:
      PORT: ${SCRAPER_PORT}
      BROWSERLESS_WS_ENDPOINT: ${BROWSERLESS_WS_ENDPOINT}
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN}
      SCRAPER_NAV_TIMEOUT_MS: ${SCRAPER_NAV_TIMEOUT_MS}
      SCRAPER_MAX_NAV_TIMEOUT_MS: ${SCRAPER_MAX_NAV_TIMEOUT_MS}
      SCRAPER_MAX_SCREENSHOT_DATA_URL_LENGTH: ${SCRAPER_MAX_SCREENSHOT_DATA_URL_LENGTH}
      LOG_LEVEL: ${LOG_LEVEL}

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - nexus-network

volumes:

  postgres-data:

  n8n-data:



networks:

  nexus-network:
    driver: bridge